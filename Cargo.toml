[package]
name = "h2n2flac"
version = "2.0.0-alpha"
edition = "2024"

[dependencies]
getopts = "0.2.0"
ndarray = "0.17.1"
# media_info = "0.6.0"
sndfile = "0.1.1"
# Only for h2n2flac-gui. It builds wxWidgets from source, which takes a few
# minutes and needs CMake and (on Linux) the GTK 3 headers, so it is off
# by default.
wxdragon = { version = "0.9.24", default-features = false, optional = true }

[features]
gui = ["dep:wxdragon"]

[lib]
name = "h2n2flac"
path = "src/lib.rs"

[[bin]]
name = "h2n2flac"
path = "src/main.rs"

[[bin]]
name = "h2n2ogg"
path = "src/main.rs"

[[bin]]
name = "h2n2flac-gui"
path = "src/bin/h2n2flac-gui.rs"
required-features = ["gui"]
